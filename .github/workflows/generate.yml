name: Generate Amnezia Configs

on:
  schedule:
    - cron: "0 */12 * * *"   # هر 12 ساعت (UTC)
  workflow_dispatch:          # دکمه اجرای دستی

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run generator
        run: python3 amnezia.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs.txt amnezia-mobile.json
          git diff --cached --quiet || (git commit -m "Update configs" && git push)
